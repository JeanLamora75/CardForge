name: CardForge Web tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "vite.config.ts"
      - "index.html"
      - "public/**"
      - "scripts/**"
      - "_bmad-output/planning-artifacts/*rule-test-matrix.md"
      - "tsconfig*.json"
      - ".github/workflows/cardforge-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "vite.config.ts"
      - "index.html"
      - "public/**"
      - "scripts/**"
      - "_bmad-output/planning-artifacts/*rule-test-matrix.md"
      - "tsconfig*.json"
      - ".github/workflows/cardforge-tests.yml"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Unit tests
        run: npm test
      - name: Install Chromium for real IndexedDB tests
        run: npx playwright install chromium
      - name: Real Chromium IndexedDB integration and two-tab concurrency
        run: npm run test:browser
      - name: Audit Mary rule matrix traceability
        run: npm run audit:rules
      - name: Assert catalog publication labels are rights-gated
        run: npm run audit:publication
      - name: TypeScript and Web build
        run: npm run build
      - name: Verify installable offline bundle
        run: npm run verify:pwa
      - name: Production PWA E2E FR EN desktop and touch offline
        run: npm run test:e2e:production

  web-quality-gate:
    name: Web MVP quality gate (no publication)
    needs: [web]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert Web checks succeeded before any future publication
        run: echo "PASS Web/PWA automated quality gate. No deployment configured; Android/iOS native not tested; legal release requires CAR-43."
