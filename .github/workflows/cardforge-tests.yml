name: CardForge Web tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "vite.config.ts"
      - "index.html"
      - "public/**"
      - "scripts/**"
      - "_bmad-output/planning-artifacts/*rule-test-matrix.md"
      - "tsconfig*.json"
      - ".github/workflows/cardforge-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "vite.config.ts"
      - "index.html"
      - "public/**"
      - "scripts/**"
      - "_bmad-output/planning-artifacts/*rule-test-matrix.md"
      - "tsconfig*.json"
      - ".github/workflows/cardforge-tests.yml"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Unit tests
        run: npm test
      - name: Audit Mary rule matrix traceability
        run: npm run audit:rules
      - name: TypeScript and Web build
        run: npm run build
      - name: Verify installable offline bundle
        run: npm run verify:pwa
