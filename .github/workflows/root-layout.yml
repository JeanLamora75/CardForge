name: CardForge root layout
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  root-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-root-layout.mjs
